const all=raw.split('\n').map(l=>{const [en,ru]=l.split(' | ');return{en,ru,k:l}});
const $=id=>document.getElementById(id);
const ls=(()=>{try{localStorage.x=1;return localStorage}catch(e){return{}}})(); // storage may be blocked (data:/private mode)
let known=new Set(JSON.parse(ls.known||'[]')),rev=ls.rev==='1',shuf=ls.shuf!=='0',q=[],back=false;
const save=()=>{try{ls.known=JSON.stringify([...known]);ls.rev=rev?1:0;ls.shuf=shuf?1:0}catch(e){}};
function build(){q=all.filter(c=>!known.has(c.k));if(shuf)q.sort(()=>Math.random()-.5);back=false;draw()}
function draw(){
  $('dir').textContent=rev?'RU → EN':'EN → RU';
  $('ord').textContent=shuf?'Вперемешку':'По порядку';
  $('stat').textContent=`Выучено ${known.size} / ${all.length}`;
  const c=q[0],el=$('card');
  if(!c){el.className='';el.textContent='Всё выучено 🎉';return}
  el.className=back?'back':'';
  el.textContent=(rev!==back)?c.ru:c.en;
}
$('card').onclick=()=>{back=!back;draw()};
$('yes').onclick=()=>{if(!q[0])return;known.add(q.shift().k);save();back=false;draw()};
$('no').onclick=()=>{if(!q[0])return;q.push(q.shift());back=false;draw()};
$('dir').onclick=()=>{rev=!rev;save();back=false;draw()};
$('ord').onclick=()=>{shuf=!shuf;save();build()};
$('reset').onclick=()=>{if(confirm('Сбросить прогресс?')){known=new Set();save();build()}};
build();
</script></body></html>
